name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          for f in tools/*.mjs runtime/remotion/scripts/probe.mjs; do node --check "$f"; done
          node runtime/html-capture/venstudio-worker.ts help > /dev/null
      - name: Validate every pack (style.json, README, provenance, fixtures, render projects)
        run: node tools/validate.mjs
      - name: Validate every skill and kit (skills/README.md), and that every hermes pack's skill is here
        run: node tools/skills.mjs
      - name: Validator unit tests
        run: node --test "tools/*.test.mjs"

  remotion:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: ${{ github.workspace }}/.remotion-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assemble the Remotion project (runtime + every remotion-2d pack, and html/ with every html-capture pack, as workers get it)
        run: node tools/assemble-remotion.mjs "$PROJECT"
      - name: Install the runtime's packages and typecheck the packs against it
        working-directory: .remotion-project
        run: |
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.json
      - name: System libraries for headless Chromium, and ffprobe
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'path-exclude /usr/share/man/*' | sudo tee /etc/dpkg/dpkg.cfg.d/01_noman >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          npx -y playwright@1.65.1 install-deps chromium
          if ! timeout 240 sh -c 'sudo apt-get install -y -qq --no-install-recommends ffmpeg'; then
            curl -fsSL -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          fi
          ffprobe -version | head -1
      - name: Full probe (a still of every composition), then the quick probe the worker runs
        working-directory: .remotion-project
        run: |
          npx remotion browser ensure
          node scripts/probe.mjs --full
          node scripts/probe.mjs
      - name: Render 3 s of every composition with the sample props and check the frame size
        working-directory: .remotion-project
        run: |
          set -euo pipefail
          mkdir -p out
          for comp in $(node -e 'for (const p of JSON.parse(require("fs").readFileSync("src/packs/packs.json","utf8"))) console.log(p.composition)'); do
            npx remotion render src/index.ts "$comp" "out/$comp.mp4" --frames=0-89 --gl=swangle --concurrency=2 --codec=h264 --log=info
            size=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "out/$comp.mp4")
            echo "$comp: $size"
            [ "$size" = "1080,1920" ] || { echo "$comp rendered $size, expected 1080,1920"; exit 1; }
          done
      - name: Render every html-capture pack's fixture with the vendored worker, then check size, fps, duration and frame count
        timeout-minutes: 20
        run: |
          set -euo pipefail
          font=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          [ -f "$font" ] || font=$(fc-list : file | sed 's/: *$//' | grep -m1 '\.ttf$')
          mkdir -p .remotion-project/out
          ids=$(node -e 'for (const p of JSON.parse(require("fs").readFileSync(".remotion-project/html/packs.json","utf8"))) console.log(p.id)')
          [ -n "$ids" ] || { echo "no html-capture pack was assembled"; exit 1; }
          for id in $ids; do
            node runtime/html-capture/venstudio-worker.ts capture-html --pack "packs/$id" --out ".remotion-project/out/$id.mp4" --remotion "$PROJECT" --font "$font"
            node tools/check-video.mjs ".remotion-project/out/$id.mp4" "packs/$id/fixtures/expect.json"
          done
      - name: Upload the clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-clips
          path: .remotion-project/out
          if-no-files-found: ignore

  # Every pack with an environment, proven without Hermes: on this clean runner, as its non-root user, the vendored
  # worker installs the recipe exactly as a Muse worker does (its own installer: pinned downloads, npm ci
  # --ignore-scripts, pip --require-hashes), runs the probe, renders the fixture with the same command renderer, and
  # tools/check-video.mjs checks it against fixtures/expect.json. A recipe that fails fails this job, with the reason in
  # the log. Downloads are cached by sha256 (the installer re-checks every cached file's hash before using it).
  environments:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENVS: ${{ github.workspace }}/.envs
      ENV_CACHE: ${{ github.workspace }}/.env-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The packs with an environment
        id: packs
        run: |
          set -euo pipefail
          ids=$(node -e 'const fs=require("fs");for(const d of fs.readdirSync("packs").sort()){const s=JSON.parse(fs.readFileSync(`packs/${d}/style.json`,"utf8"));if(s.environment)console.log(d)}' | tr '\n' ' ')
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "packs with an environment: ${ids:-none}"
      - name: Cache downloads by sha256
        if: steps.packs.outputs.ids != ''
        uses: actions/cache@v4
        with:
          path: .env-cache
          key: envs-${{ hashFiles('packs/*/style.json', 'packs/*/env/**') }}
          restore-keys: envs-
      - name: ffmpeg and ffprobe (the worker's encode and check-video)
        if: steps.packs.outputs.ids != ''
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'path-exclude /usr/share/man/*' | sudo tee /etc/dpkg/dpkg.cfg.d/01_noman >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          if ! timeout 240 sh -c 'sudo apt-get install -y -qq --no-install-recommends ffmpeg'; then
            curl -fsSL -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          fi
          ffprobe -version | head -1
      - name: Install each environment from its recipe with the vendored worker (non-root), then its probe
        if: steps.packs.outputs.ids != ''
        run: |
          set -euo pipefail
          [ "$(id -u)" != "0" ] || { echo "this step must run as a non-root user"; exit 1; }
          for id in ${{ steps.packs.outputs.ids }}; do
            echo "::group::env-install $id"
            node runtime/html-capture/venstudio-worker.ts env-install --pack "packs/$id" --envs "$ENVS" --cache "$ENV_CACHE"
            echo "::endgroup::"
          done
      - name: Render each fixture with the vendored worker's command renderer, then check size, fps, duration and frame count
        if: steps.packs.outputs.ids != ''
        timeout-minutes: 25
        run: |
          set -euo pipefail
          font=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          [ -f "$font" ] || font=$(fc-list : file | sed 's/: *$//' | grep -m1 '\.ttf$')
          mkdir -p .env-out
          for id in ${{ steps.packs.outputs.ids }}; do
            engine=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).renderer.engine)' "packs/$id/style.json")
            [ "$engine" = "command" ] || { echo "$id: $engine renders in its own job; its environment was installed and probed above"; continue; }
            node runtime/html-capture/venstudio-worker.ts render-command --pack "packs/$id" --envs "$ENVS" --out ".env-out/$id.mp4" --font "$font"
            node tools/check-video.mjs ".env-out/$id.mp4" "packs/$id/fixtures/expect.json"
          done
      - name: Upload the clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-clips
          path: .env-out
          if-no-files-found: ignore
